{{- if .Values.externalSecrets.enabled }}
{{- range $name, $config := .Values.externalSecrets }}
{{- if ne $name "enabled" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "go-htmx-fiber.fullname" $ }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "go-htmx-fiber.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $config.refreshInterval | default "15m" }}
  
  secretStoreRef:
    name: {{ $config.secretStoreRef.name }}
    kind: {{ $config.secretStoreRef.kind }}
  
  target:
    name: {{ $config.target.name }}
    {{- if $config.target.template }}
    template:
      engineVersion: v2
      type: Opaque
      data:
        {{- range $key, $value := $config.target.template.data }}
        {{ $key }}: "{{ $value }}"
        {{- end }}
    {{- end }}
  
  {{- if $config.dataFrom }}
  dataFrom:
    {{- range $config.dataFrom }}
    - extract:
        key: {{ .extract.key }}
    {{- end }}
  {{- else if $config.data }}
  data:
    {{- range $config.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteRef.key }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
