# Default values for go-htmx-fiber
replicaCount: 2

image:
  registry: ghcr.io
  repository: igorsilva-dev/go_htmx_fiber_fullstack
  pullPolicy: IfNotPresent
  tag: ""  # Overridden by the chart appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8080

# Ingress configuration (AWS Load Balancer Controller)
ingress:
  enabled: true
  annotations: {}   

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 5

# ConfigMap for non-sensitive environment variables
configMap:
  enabled: true
  data:
    APP_ENV: production
    APP_PORT: "8080"
    DB_SSLMODE: require
    

# External Secrets configuration (AWS Secrets Manager)
externalSecrets:
  enabled: true
  secretStore:
    name: aws-secrets-store    
    kind: SecretStore
  refreshInterval: 15m
  secretPrefix: development/go-htmx-fiber/   
  
  jsonSecret:
    enabled: true
    secretKey: dbCredentials
    secretName: db_credentials
    fields:
      - jsonKey: dbCredentials
        jsonField: hostname
        envName: DB_HOST
      - jsonKey: dbCredentials
        jsonField: port
        envName: DB_PORT
      - jsonKey: dbCredentials
        jsonField: username
        envName: DB_USER
      - jsonKey: dbCredentials
        jsonField: password
        envName: DB_PASSWORD
      - jsonKey: dbCredentials
        jsonField: database
        envName: DB_NAME  
  
  secrets:
    - key: csrf_secret
      name: CSRF_SECRET
    - key: session_key
      name: SESSION_KEY
    

# Service Account configuration
serviceAccount:
  create: true
  name: "go-htmx-fiber-sa"
  annotations: {} 

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}

affinity: {}

tolerations: {}

env: []
